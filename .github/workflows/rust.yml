name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets release.yml call this as a reusable workflow, so a release build
  # always goes through the same fmt/clippy/build/test gate as every push.
  workflow_call:

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mbround18/paws/actions/paws-up@main

      # fmt --check, clippy, build --verbose, test --verbose against the
      # workspace (shared/server/agent), same steps this job ran directly
      # before, now driven through Dagger by `paws` instead of a bare
      # dtolnay/rust-toolchain + cargo invocation.
      - run: paws ci --toolchain rust
