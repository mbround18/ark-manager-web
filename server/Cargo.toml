[package]
name = "server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
shared = {path="../shared"}
actix-files = "0.7.0"
actix-web = "4.11.0"
async-stream = "0.3.6"
which = "8.0.5"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strip-ansi-escapes = "0.2.1"
linemux = "0.3"
urlencoding = "2.1.3"

[features]
use_binary = []
