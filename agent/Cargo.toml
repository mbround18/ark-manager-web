[package]
name = "agent"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "agent"

[dependencies]
shared = {path="../shared"}
gsm-instance = { git = "https://github.com/mbround18/game-server-management", tag = "v0.2.0" }
gsm-shared = { git = "https://github.com/mbround18/game-server-management", tag = "v0.2.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

