[package]
name = "agent"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "agent"

[dependencies]
shared = {path="../shared"}
socket2 = "0.6.5"
async-process = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = "0.4.45"
which = "8.0.5"
futures = "0.3.34"
futures-lite = "2.6.1"

